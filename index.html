<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="SNAKE MMA - لعبة ثعبان أركيد خفيفة وممتعة">
  <title>SNAKE MMA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🐍</span><div><strong>SNAKE MMA</strong><small>ARCADE SNAKE</small></div></div>
      <button id="soundBtn" class="icon-btn" aria-label="تشغيل أو إيقاف الصوت" title="الصوت">🔊</button>
    </header>

    <section class="stats" aria-label="إحصائيات الجولة">
      <div class="stat"><span>النقاط</span><strong id="score">0</strong></div>
      <div class="stat"><span>الوقت</span><strong id="time">00:00</strong></div>
      <div class="stat"><span>المستوى</span><strong id="level">1</strong></div>
    </section>

    <section class="game-wrap">
      <canvas id="game" aria-label="مساحة اللعب"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <div class="hero-emoji" id="overlayEmoji">🐍</div>
          <p class="eyebrow">READY, SET, SNAKE!</p>
          <h1 id="overlayTitle">SNAKE MMA</h1>
          <p id="overlayText">اجمع الوجبات، كبّر ثعبانك، وابتعد عن العقبات!</p>
          <button id="mainBtn" class="primary-btn">ابدأ اللعب <span>←</span></button>
          <small class="hint">اسحب لتغيير الاتجاه • أو استخدم الأسهم</small>
        </div>
      </div>
      <button id="pauseBtn" class="pause-btn" aria-label="إيقاف مؤقت" hidden>Ⅱ</button>
    </section>

    <div class="below-game">
      <div class="legend"><span>🍎 +10</span><span>🍩 +20</span><span>🍓 +25</span><span>⭐ +50</span></div>
      <div class="mobile-controls" aria-label="أزرار التحكم">
        <button data-dir="up" aria-label="أعلى">▲</button>
        <div><button data-dir="left" aria-label="يسار">◀</button><button data-dir="down" aria-label="أسفل">▼</button><button data-dir="right" aria-label="يمين">▶</button></div>
      </div>
      <section class="records" aria-label="إحصائياتك المحفوظة"><h2>إنجازاتك</h2><div class="record-grid"><div><span>أعلى نتيجة</span><strong id="bestScore">0</strong></div><div><span>أعلى مستوى</span><strong id="bestLevel">1</strong></div><div><span>إجمالي الطعام</span><strong id="totalFood">0</strong></div><div><span>عدد الجولات</span><strong id="gamesPlayed">0</strong></div></div></section><p class="footer-note">إنجازاتك محفوظة على هذا الجهاز فقط.</p>
    </div>
  </main>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
